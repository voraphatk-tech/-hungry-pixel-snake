<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Hungry Pixel Snakes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1830">
<meta name="description" content="เกมปริศนางูหิวพิกเซล สำหรับเล่นในครอบครัว">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="งูหิว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap">
<style>
/* One-screen game: header bar on top, one canvas fills the rest (board, poles + hole, egg columns). */
:root{
  --bg:#1d1830; --panel:#2a2342; --ink:#fff4e0; --muted:#b9acd6; --sun:#ffcc4d; --berry:#e8425a;
  --font:'Mitr',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;box-sizing:border-box;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:6px;padding-block:6px;flex:none}
button{font:inherit;color:var(--ink);background:var(--panel);border:0;border-radius:12px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:18px}
button:active{transform:scale(.94)}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#lvl{flex:1;min-width:0;text-align:center;line-height:1.15}
#lname{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lstat{font-size:12px;color:var(--muted)}
#cnt{background:var(--panel);border-radius:12px;height:40px;display:flex;align-items:center;padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s}
#cnt.full{background:var(--berry)}
#wrap{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,10,28,.6);z-index:5}
.card{background:var(--panel);border-radius:20px;padding:22px 20px;text-align:center;width:min(300px,86%);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h2{margin:0 0 6px;font-size:26px;color:var(--sun)}
.card p{margin:0 0 16px;color:var(--muted)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card button{background:var(--sun);color:#2a2342;font-weight:600;height:46px;padding:0 18px}
.card button.alt{background:#463b66;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="prev" aria-label="ด่านก่อนหน้า">◀</button>
    <div id="lvl"><span id="lname"></span><span id="lstat"></span></div>
    <button id="next" aria-label="ด่านถัดไป">▶</button>
    <div id="cnt">🐍 0/5</div>
    <button id="restart" aria-label="เริ่มใหม่">↻</button>
    <button id="mute" aria-label="เปิด/ปิดเสียง">🔊</button>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="ov" hidden><div class="card"><h2 id="ovT"></h2><p id="ovP"></p><div class="row"><button id="ovB" class="alt"></button><button id="ovA"></button></div></div></div>
  </div>
</div>
<script src="levels.js"></script>
<script src="game.js"></script>
<script>
// Offline support: register the service worker (only works over https or localhost).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
